<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join AHOY</title>
  <meta name="description" content="Create or manage your universal AHOY account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/cubano?display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family:"IBM Plex Sans",sans-serif; color:#fff; background:#04121d; }
    * { box-sizing:border-box; }
    body { min-height:100vh; margin:0; display:grid; place-items:center; padding:24px; background:radial-gradient(circle at 70% 15%,rgba(43,151,171,.2),transparent 36%),linear-gradient(145deg,#061927,#020910 70%); }
    main { width:min(560px,100%); padding:clamp(28px,7vw,64px); border:1px solid rgba(120,208,210,.3); border-radius:28px; background:rgba(5,21,32,.88); box-shadow:0 30px 90px rgba(0,0,0,.45); text-align:center; }
    .mark { color:#fff; font-family:Cubano,"Arial Black",sans-serif; font-size:1.45rem; letter-spacing:.08em; }
    .eyebrow { margin-top:48px; color:#78d0d2; font-size:.76rem; letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:14px 0 14px; font-family:"Barlow Condensed",sans-serif; font-size:clamp(3.6rem,12vw,6.5rem); line-height:.8; text-transform:uppercase; letter-spacing:-.04em; }
    p { margin:0 auto; max-width:38ch; color:rgba(255,255,255,.68); line-height:1.6; }
    .actions { display:grid; gap:12px; margin-top:30px; }
    a { display:flex; min-height:52px; align-items:center; justify-content:center; border-radius:999px; text-decoration:none; font-weight:700; }
    .primary { background:#fff; color:#06121b; }
    .secondary { border:1px solid rgba(255,255,255,.25); color:#fff; }
    .back { display:inline-block; margin-top:28px; color:rgba(255,255,255,.5); font-size:.86rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark">AHOY</div>
    <div class="eyebrow">Your universal account</div>
    <h1>Come aboard.</h1>
    <p>One account for AHOY. Create your account or sign in once, then use the same identity across ahoy.ooo and AHOY Indie Media.</p>
    <div class="actions">
      <a class="primary" href="https://app.ahoy.ooo">Continue to AHOY</a>
      <a class="secondary" href="https://app.ahoy.ooo">I already have an account</a>
    </div>
    <a class="back" href="/">Back to ahoy.ooo</a>
  </main>
</body>
</html>
